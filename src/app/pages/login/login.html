<div class="login-container">

  <h1>Connexion</h1>

  <form (ngSubmit)="onSubmit()">

    <input
      type="text"
      [(ngModel)]="login"
      name="login"
      placeholder="Login"
      required
    />

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Mot de passe"
      required
    />

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>

    @if (error()) {
        <p class="error">
            {{ error() }}
        </p>
    }
  </form>

</div>
